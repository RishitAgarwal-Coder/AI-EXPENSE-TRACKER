# SmartSpend Database Configuration
# You can change these to match your local MySQL credentials

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/smartspend_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=root

# Fallback to local embedded database if MySQL server is not running
# This allows the project to be evaluated seamlessly even before starting MySQL
db.fallback.enabled=true
db.fallback.url=jdbc:h2:mem:smartspend_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
db.fallback.user=sa
db.fallback.password=
